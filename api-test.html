<!DOCTYPE html>
<html>
<head>
    <title>API Base Injection Test</title>
</head>
<body>
    <h1>API Base Injection Test</h1>
    <div id="result"></div>
    <div id="api-test"></div>

    <script>
        // Simulate the API base injection script from index.html
        (function () {
            try {
                var origin = window.location.origin;
                console.log('Origin:', origin);

                // Only rewrite in Codespaces
                if (origin.includes('.app.github.dev') && origin.includes('-3000.')) {
                    window.__API_BASE__ = origin.replace('-3000.', '-4000.');
                    console.log('Set API_BASE for Codespaces:', window.__API_BASE__);
                }

                // Allow manual override via URL parameter
                var urlParams = new URLSearchParams(window.location.search);
                var apiBase = urlParams.get('api_base');
                if (apiBase) {
                    window.__API_BASE__ = apiBase;
                    console.log('[API_BASE] Override from URL:', apiBase);
                }

                // Log once so we can confirm in the browser console
                if (window.__API_BASE__) {
                    console.log('[API_BASE]', window.__API_BASE__);
                    document.getElementById('result').innerHTML = 'API Base: ' + window.__API_BASE__;
                } else {
                    console.log('[API_BASE] Not set, using default');
                    document.getElementById('result').innerHTML = 'API Base: Not set (using default)';
                }
            } catch (e) {
                console.warn('API base injection failed:', e);
                document.getElementById('result').innerHTML = 'Error: ' + e.message;
            }
        })();

        // Simulate the getApiBase function from base.js
        function getApiBase() {
            // Highest priority: a value injected at runtime
            if (typeof window !== "undefined" && window.__API_BASE__) return window.__API_BASE__;

            // Detect environment and set appropriate API base
            try {
                const { origin, hostname } = window.location;

                // GitHub Codespaces
                if (hostname.includes('.app.github.dev')) {
                    if (hostname.includes('-3000.')) {
                        return origin.replace('-3000.', '-4000.');
                    }
                }

                // Local development
                if (hostname === 'localhost' || hostname === '127.0.0.1') {
                    return 'http://localhost:4000';
                }

                // Production or other environments - use relative URLs
                return '';

            } catch (_) {
                return 'http://localhost:4000';
            }
        }

        // Test API connectivity
        async function testAPI() {
            const apiBase = getApiBase();
            try {
                const response = await fetch(apiBase + '/api/health');
                const data = await response.json();
                document.getElementById('api-test').innerHTML =
                    'API Test: SUCCESS<br>' +
                    'API Base: ' + apiBase + '<br>' +
                    'Response: ' + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('api-test').innerHTML =
                    'API Test: FAILED<br>' +
                    'API Base: ' + apiBase + '<br>' +
                    'Error: ' + error.message;
            }
        }

        // Run test after page loads
        window.onload = function() {
            setTimeout(testAPI, 1000);
        };
    </script>
</body>
